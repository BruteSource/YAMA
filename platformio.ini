; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned to 6.9.0 (bundles arduino-esp32 2.x). The latest platform version
; (arduino-esp32 3.x) bundles a newer ADC subsystem that ships BOTH a
; legacy driver and a new "driver_ng" one side by side; something pulled
; in by PixelRoot32/TFT_eSPI (never pinned down to an exact call site —
; grepped every ADC-adjacent path in the dependency tree: XPT2046/touch
; calibration, the DAC and I2S audio backends, AudioEngine's own
; construction — all cleanly `#if`-gated off, none of them the cause)
; triggers a "ADC: CONFLICT! driver_ng is not allowed to be used with the
; legacy driver" abort loop the instant PixelRoot32 is merely present in
; lib_deps, even with every feature flag disabled and zero application
; code referencing it. Confirmed by bisection: removing the dependency
; entirely fixes it; so does pinning the platform back to this version,
; whose bundled core predates the driver split. Revisit this pin if a
; future PixelRoot32/TFT_eSPI release fixes the conflict upstream.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200

; --- Temporary single-game PixelRoot32 build ---
; The console (menu + Arkanoid/Tetris/Bust-a-Move/R-Type) is set aside for
; now while Bubble Bobble is rebuilt on the PixelRoot32 engine instead of
; this project's old hand-rolled direct-to-display rendering. Deliberately
; only ONE display-driver library is active in this build (PixelRoot32's
; own TFT_eSPI-based renderer) — no switching between it and the old
; Adafruit_ST7789 pipeline, at the user's explicit request, since two
; display drivers taking turns on one physical SPI bus is untested
; territory. See src/main.cpp and the plan file for the full picture.
; The other games' source stays in the repo untouched, just excluded from
; this build via src_filter below.
src_filter =
    +<*>
    -<arkanoid.cpp>
    -<tetris.cpp>
    -<bustamove.cpp>
    -<rtype.cpp>
    -<menu.cpp>
    -<games_registry.cpp>
    -<sound.cpp>
    -<palette.cpp>
    -<bubblebobble.cpp>

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.1
    gperez88/PixelRoot32-Game-Engine@^1.10.0

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    ; Default MAX_ENTITIES/PHYSICS_MAX_ENTITIES (64) is exactly what a
    ; single busy level (up to ~49 platform/wall actors + Bub + 3 enemies)
    ; already uses -- fine standalone, but the level-transition scroll
    ; (BubbleBobbleScene::buildLevelPreview()) keeps the CURRENT level's
    ; entities alive while also registering the NEXT level's preview
    ; copy, so a worst-case pairing (e.g. level 2's 45 platforms -> level
    ; 3's 28) can ask for 70+ entities at once. Past 64, Scene::addEntity()
    ; silently no-ops (drops the entity, no error/assert) -- with the
    ; default cap that showed up as some of the incoming level's platforms
    ; missing only during the ~0.9s scroll animation (self-correcting the
    ; instant the real, non-preview rebuild runs). Bumped again (128->192)
    ; after level 5's alternating-pillar design plus the new per-level
    ; floor/ceiling boundary actors (every level now builds 2-4 boundary
    ; actors instead of 1) pushed a single level's own actor count to ~65
    ; on its own -- the worst-case transition pairing (two such levels at
    ; once, plus Bub/enemies) needed more room than 128 gave with any real
    ; margin. Bumped with real headroom for future levels, not just
    ; today's worst pair.
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D MAX_ENTITIES=128
    -D PHYSICS_MAX_ENTITIES=128
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_SPATIAL_QUERY=1
    -D PIXELROOT32_ENABLE_2BPP_SPRITES
    -D PIXELROOT32_ENABLE_4BPP_SPRITES
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1
    -D PIXELROOT32_ENABLE_SCENE_ARENA
    -D PLATFORM_ESP32DEV
    ; TFT config: ST7789, this board's real wiring (see src/hardware.h) —
    ; 240x320, not the 240x240 panel PixelRoot32's own esp32dev examples
    ; target.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
